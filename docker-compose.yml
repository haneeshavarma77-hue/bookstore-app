services:

  # ── PostgreSQL ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: bookstore-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-bookstore}
      POSTGRES_USER:     ${POSTGRES_USER:-bookstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"          # remove this line in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookstore} -d ${POSTGRES_DB:-bookstore}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  # ── Spring Boot App ────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookstore-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Datasource
      SPRING_DATASOURCE_URL:      jdbc:postgresql://db:5432/${POSTGRES_DB:-bookstore}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bookstore}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      # JPA / Hibernate
      SPRING_JPA_HIBERNATE_DDL_AUTO:   update
      SPRING_JPA_SHOW_SQL:             false
      # Profile
      SPRING_PROFILES_ACTIVE:          ${SPRING_PROFILE:-prod}
      # JVM
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+ExitOnOutOfMemoryError
    expose:
      - "8080"                   # internal only; nginx is the public entry point
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - backend
      - frontend

  # ── Nginx reverse proxy ────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: bookstore-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend

# ── Volumes ────────────────────────────────────────────────────
volumes:
  db_data:
    driver: local

# ── Networks ───────────────────────────────────────────────────
networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
